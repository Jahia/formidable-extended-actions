# Formidable Redirect: editor labels and tooltips of the Redirect action.
fmdbred_redirectAction=Redirection
fmdbred_redirectAction.ui.tooltip=Envoie le visiteur vers une autre page du site une fois la soumission accept\u00e9e. Le message de soumission s'affiche pendant que le navigateur change de page.
fmdbred_redirectAction.targetType=Destination
fmdbred_redirectAction.targetType.ui.tooltip=Une page du site choisie dans le s\u00e9lecteur de pages, ou un chemin du site que vous saisissez. Jamais un autre site web.
fmdbred_redirectAction.targetType.page=Une page du site
fmdbred_redirectAction.targetType.path=Un chemin du site
fmdbred_redirectAction.page=Page
fmdbred_redirectAction.page.ui.tooltip=La page vers laquelle le visiteur est envoy\u00e9. Elle suit la page si celle-ci est d\u00e9plac\u00e9e ou renomm\u00e9e, et doit \u00eatre publi\u00e9e.
fmdbred_redirectAction.path=Chemin
fmdbred_redirectAction.path.ui.tooltip=Un chemin de ce site, commen\u00e7ant par une seule barre oblique. <b>Exemple :</b> <i>/sites/monsite/merci.html</i>. Un autre site web est refus\u00e9.
