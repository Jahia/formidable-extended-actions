# Formidable Redirect: editor labels and tooltips of the Redirect action.
fmdbred_redirectAction=Redirecionamento
fmdbred_redirectAction.ui.tooltip=Envia o visitante para outra página do site depois de a submissão ser aceite. A mensagem de submissão é mostrada enquanto o navegador muda de página.
fmdbred_redirectAction.targetType=Destino
fmdbred_redirectAction.targetType.ui.tooltip=Uma página do site escolhida no seletor de páginas, ou um caminho do site que escreve. Nunca outro site.
fmdbred_redirectAction.targetType.page=Uma página do site
fmdbred_redirectAction.targetType.path=Um caminho do site
fmdbred_redirectAction.page=Página
fmdbred_redirectAction.page.ui.tooltip=A página para onde o visitante é enviado. Acompanha a página quando é movida ou renomeada, e tem de estar publicada.
fmdbred_redirectAction.path=Caminho
fmdbred_redirectAction.path.ui.tooltip=Um caminho deste site, começando por uma única barra. <b>Exemplo:</b> <i>/sites/meusite/obrigado.html</i>. Outro site é recusado.
