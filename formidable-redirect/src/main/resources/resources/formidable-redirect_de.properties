# Formidable Redirect: editor labels and tooltips of the Redirect action.
fmdbred_redirectAction=Weiterleitung
fmdbred_redirectAction.ui.tooltip=Leitet den Besucher nach der Annahme der \u00dcbermittlung auf eine andere Seite der Website weiter. Die \u00dcbermittlungsnachricht wird angezeigt, w\u00e4hrend der Browser die Seite wechselt.
fmdbred_redirectAction.targetType=Ziel
fmdbred_redirectAction.targetType.ui.tooltip=Eine im Seitenw\u00e4hler gew\u00e4hlte Seite der Website oder ein von Ihnen eingegebener Pfad der Website. Nie eine andere Website.
fmdbred_redirectAction.targetType.page=Eine Seite der Website
fmdbred_redirectAction.targetType.path=Ein Pfad der Website
fmdbred_redirectAction.page=Seite
fmdbred_redirectAction.page.ui.tooltip=Die Seite, auf die der Besucher weitergeleitet wird. Sie folgt der Seite bei Verschiebung oder Umbenennung und muss ver\u00f6ffentlicht sein.
fmdbred_redirectAction.path=Pfad
fmdbred_redirectAction.path.ui.tooltip=Ein Pfad dieser Website, der mit einem einzelnen Schr\u00e4gstrich beginnt. <b>Beispiel:</b> <i>/sites/meineseite/danke.html</i>. Eine andere Website wird abgelehnt.
