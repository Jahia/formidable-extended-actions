# default configuration - won't be overriden
# Formidable flight number check (formidable-flight-check). Deployed once to karaf/etc, then kept as edited.
#
# AeroDataBox through RapidAPI, for the flights of every airline but the own one. Subscribe to AeroDataBox on
# RapidAPI (free Basic plan) and put the key in .credential (the leading dot keeps it off the OSGi service list).
# Empty key: flights of other airlines are an unavailable check, which the contributor's
# "If the check cannot run" setting decides.
url=https://aerodatabox.p.rapidapi.com
apiHost=aerodatabox.p.rapidapi.com
.credential=
# The site's own airline, if it has one: its flights are judged against this schedule, never sent to AeroDataBox.
# ownAirlineCode is its IATA code (AB), ownAirlineName its name, ownFlights its flights, comma-separated, each with
# its route when the form should fill the airports: AB123:HKG-NRT. Empty: every flight goes to AeroDataBox.
ownAirlineCode=
ownAirlineName=
ownFlights=
# true: never call AeroDataBox (a demo without network, or a quota spent).
offline=false
# Lookups the form's page may ask per visitor address and minute (0 switches the lookup off).
lookupsPerMinute=20
connectTimeoutSeconds=5
requestTimeoutSeconds=10
