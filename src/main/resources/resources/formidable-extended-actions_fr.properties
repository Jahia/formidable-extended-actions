# Formidable Extended Actions - editor labels and tooltips of every family (the module resource bundle:
# Jahia resolves the labels of definitions.cnd from resources/formidable-extended-actions*.properties).
# The sentences a visitor reads live in formidable-extended-actions-<family>*.properties.
# ASCII only, accents as \uXXXX escapes.

# ---- Accounts (fmdbacc) ----
fmdbacc_createAccountAction=Cr\u00e9er un compte
fmdbacc_createAccountAction.ui.tooltip=Cr\u00e9e le compte du visiteur qui envoie le formulaire : identifiant tir\u00e9 de l'e-mail, mot de passe hach\u00e9 par Jahia, groupe optionnel, connexion optionnelle, activation par e-mail optionnelle. Le formulaire doit avoir l'option CAPTCHA et un champ mot de passe (Saisie de mot de passe). N'ajoutez pas sur le m\u00eame formulaire une action Sauvegarde JCR ou E-mail du contenu du formulaire pour conserver le mot de passe : ces actions ne le re\u00e7oivent jamais.
fmdbacc_createAccountAction.emailField=Champ e-mail
fmdbacc_createAccountAction.emailField.ui.tooltip=Le champ qui contient l'adresse e-mail du visiteur. C'est aussi l'identifiant du compte.
fmdbacc_createAccountAction.passwordField=Champ mot de passe
fmdbacc_createAccountAction.passwordField.ui.tooltip=Le champ mot de passe du formulaire (Saisie de mot de passe). Un champ texte ordinaire est refus\u00e9 : le mot de passe serait enregistr\u00e9 et envoy\u00e9 par e-mail comme n'importe quelle r\u00e9ponse.
fmdbacc_createAccountAction.firstNameField=Champ pr\u00e9nom
fmdbacc_createAccountAction.firstNameField.ui.tooltip=Optionnel. Le champ dont la valeur devient le pr\u00e9nom du compte.
fmdbacc_createAccountAction.lastNameField=Champ nom
fmdbacc_createAccountAction.lastNameField.ui.tooltip=Optionnel. Le champ dont la valeur devient le nom du compte.
fmdbacc_createAccountAction.group=Groupe
fmdbacc_createAccountAction.group.ui.tooltip=Optionnel. Le groupe que rejoint le nouveau compte, parmi les groupes autoris\u00e9s par votre administrateur (<i>allowedGroups</i> dans la configuration du module) : un groupe global, ou un groupe de ce site. Un groupe qui donne acc\u00e8s au back-office est refus\u00e9 \u00e0 l'inscription. Liste vide : demandez \u00e0 l'administrateur.
fmdbacc_createAccountAction.signIn=Connecter le visiteur
fmdbacc_createAccountAction.signIn.ui.tooltip=Connecte le visiteur d\u00e8s que le compte est cr\u00e9\u00e9, par la connexion native de Jahia. Ignor\u00e9 quand l'activation par e-mail est requise : le visiteur se connecte apr\u00e8s l'avoir activ\u00e9.
fmdbacc_createAccountAction.redirectPage=Page de destination
fmdbacc_createAccountAction.redirectPage.ui.tooltip=La page vers laquelle le visiteur est envoy\u00e9 une fois le compte cr\u00e9\u00e9. Une page du site, publi\u00e9e.
fmdbacc_createAccountAction.redirectParameter=Param\u00e8tre de retour
fmdbacc_createAccountAction.redirectParameter.ui.tooltip=Optionnel. Le nom d'un param\u00e8tre de l'adresse de la page du formulaire qui dit o\u00f9 allait le visiteur, par exemple <i>redirect</i> pour <i>/inscription?redirect=/membres</i>. Utilis\u00e9 quand le visiteur est connect\u00e9, avant la page ci-dessus, et seulement si c'est un chemin de ce site.
fmdbacc_createAccountAction.passwordPattern=R\u00e8gle du mot de passe
fmdbacc_createAccountAction.passwordPattern.ui.tooltip=Optionnel. Expression r\u00e9guli\u00e8re que le mot de passe entier doit v\u00e9rifier. Vide : au moins un chiffre, une minuscule, une majuscule et un symbole, de 8 \u00e0 64 caract\u00e8res.
fmdbacc_createAccountAction.activationRequired=Exiger l'activation par e-mail
fmdbacc_createAccountAction.activationRequired.ui.tooltip=Le compte est cr\u00e9\u00e9 verrouill\u00e9 et le visiteur re\u00e7oit un lien par e-mail ; il devient utilisable quand le lien est suivi. Demande que le service de messagerie de Jahia soit configur\u00e9. D\u00e9sactiv\u00e9 par d\u00e9faut.
fmdbacc_createAccountAction.activationHours=Validit\u00e9 du lien (heures)
fmdbacc_createAccountAction.activationHours.ui.tooltip=Dur\u00e9e pendant laquelle le lien d'activation fonctionne. 48 par d\u00e9faut, 720 au maximum.
fmdbacc_createAccountAction.activationPage=Page apr\u00e8s activation
fmdbacc_createAccountAction.activationPage.ui.tooltip=La page o\u00f9 arrive le visiteur une fois le lien suivi (par exemple une page avec le formulaire de connexion). Elle re\u00e7oit <i>fmdbActivation=done</i>. Vide : une courte page de confirmation.
fmdbacc_createAccountAction.activationSubject=Objet de l'e-mail d'activation
fmdbacc_createAccountAction.activationSubject.ui.tooltip=Optionnel. Vide : l'objet du module, dans la langue du visiteur.
fmdbacc_createAccountAction.activationMessage=Message de l'e-mail d'activation
fmdbacc_createAccountAction.activationMessage.ui.tooltip=Optionnel. <b>${link}</b> est remplac\u00e9 par le lien d'activation et <b>${hours}</b> par sa validit\u00e9. Vide : le message du module, dans la langue du visiteur.
fmdbacc_createAccountAction.pendingMessage=Message en attente d'activation
fmdbacc_createAccountAction.pendingMessage.ui.tooltip=Optionnel. Affich\u00e9 \u00e0 la place du message d'envoi du formulaire quand le compte attend son e-mail d'activation. Vide : le message du module.

fmdbacc_signInAction=Se connecter
fmdbacc_signInAction.ui.tooltip=Connecte le visiteur par la connexion native de Jahia. Le formulaire doit avoir l'option CAPTCHA et un champ mot de passe (Saisie de mot de passe). Un \u00e9chec se lit toujours de la m\u00eame fa\u00e7on, que le compte existe ou non.
fmdbacc_signInAction.loginField=Champ e-mail ou identifiant
fmdbacc_signInAction.loginField.ui.tooltip=Le champ o\u00f9 le visiteur saisit son adresse e-mail ou son identifiant.
fmdbacc_signInAction.passwordField=Champ mot de passe
fmdbacc_signInAction.passwordField.ui.tooltip=Le champ mot de passe du formulaire (Saisie de mot de passe). Un champ texte ordinaire est refus\u00e9.
fmdbacc_signInAction.redirectPage=Page de destination
fmdbacc_signInAction.redirectPage.ui.tooltip=La page vers laquelle le visiteur est envoy\u00e9 une fois connect\u00e9. Une page du site, publi\u00e9e.
fmdbacc_signInAction.redirectParameter=Param\u00e8tre de retour
fmdbacc_signInAction.redirectParameter.ui.tooltip=Optionnel. Le nom d'un param\u00e8tre de l'adresse de la page du formulaire qui dit o\u00f9 allait le visiteur, par exemple <i>redirect</i> pour <i>/connexion?redirect=/membres</i>. Utilis\u00e9 avant la page ci-dessus, et seulement si c'est un chemin de ce site.
fmdbacc_signInAction.failureMessage=Message en cas d'\u00e9chec
fmdbacc_signInAction.failureMessage.ui.tooltip=Optionnel. Affich\u00e9 quand l'e-mail ou le mot de passe est faux. Gardez-le identique pour les deux. Vide : le message du module, dans la langue du visiteur.

# ---- Content (fmdbcnt) ----
fmdbcnt_createContentAction=Cr\u00e9er un contenu
fmdbcnt_createContentAction.ui.tooltip=Cr\u00e9e un contenu \u00e0 partir de la soumission d'un utilisateur connect\u00e9 : les champs du formulaire remplissent les propri\u00e9t\u00e9s d'un n\u0153ud du type choisi, les fichiers envoy\u00e9s sont stock\u00e9s et r\u00e9f\u00e9renc\u00e9s par lui, puis le tout est publi\u00e9. Les visiteurs anonymes sont refus\u00e9s. Le contenu n'est \u00e9crit que dans un dossier que l'utilisateur peut lire, celui que d\u00e9signe son groupe.
fmdbcnt_createContentAction.contentType=Type de contenu
fmdbcnt_createContentAction.contentType.ui.tooltip=Le type de n\u0153ud \u00e0 cr\u00e9er, avec son pr\u00e9fixe (par exemple ctmd:submission). Il doit exister, ne pas \u00eatre abstrait et \u00eatre autoris\u00e9 dans le dossier cible.
fmdbcnt_createContentAction.parentFolder=Dossier des contenus
fmdbcnt_createContentAction.parentFolder.ui.tooltip=Le dossier dans lequel le contenu est cr\u00e9\u00e9. Avec un pr\u00e9fixe de groupe, c'est le dossier qui contient un sous-dossier par groupe. Il doit \u00eatre publi\u00e9 : l'action le lit dans l'espace de travail live.
fmdbcnt_createContentAction.filesFolder=Dossier des fichiers
fmdbcnt_createContentAction.filesFolder.ui.tooltip=Le dossier dans lequel les fichiers envoy\u00e9s sont stock\u00e9s. Avec un pr\u00e9fixe de groupe, il contient les m\u00eames sous-dossiers que le dossier des contenus. Obligatoire d\u00e8s qu'un champ d'envoi de fichiers est associ\u00e9.
fmdbcnt_createContentAction.groupPrefix=Pr\u00e9fixe de groupe
fmdbcnt_createContentAction.groupPrefix.ui.tooltip=Facultatif. S'il est renseign\u00e9, on cherche parmi les groupes de l'utilisateur celui dont le nom commence par ce pr\u00e9fixe ; le reste du nom est le sous-dossier du dossier des contenus et du dossier des fichiers (pr\u00e9fixe <i>orvane-supplier-</i> et groupe <i>orvane-supplier-northlight</i> donnent le sous-dossier <i>northlight</i>). Les sous-dossiers doivent d\u00e9j\u00e0 exister : ils ne sont jamais cr\u00e9\u00e9s. Aucun groupe correspondant, plusieurs, ou un sous-dossier absent font refuser la soumission.
fmdbcnt_createContentAction.titleField=Champ du titre
fmdbcnt_createContentAction.titleField.ui.tooltip=Le champ dont la valeur devient le titre du contenu (jcr:title), dans toutes les langues du site. Il donne aussi son nom au n\u0153ud.
fmdbcnt_createContentAction.fieldMappings=Correspondance des champs
fmdbcnt_createContentAction.fieldMappings.ui.tooltip=Une ligne par champ : <i>champ=propri\u00e9t\u00e9</i>. La valeur est convertie au type de la propri\u00e9t\u00e9 (texte, entier, d\u00e9cimal, vrai ou faux, date au format aaaa-mm-jj ; une propri\u00e9t\u00e9 multiple re\u00e7oit toutes les valeurs du champ). Une propri\u00e9t\u00e9 inconnue ou une valeur inadapt\u00e9e fait refuser la soumission.
fmdbcnt_createContentAction.fileMappings=Correspondance des fichiers
fmdbcnt_createContentAction.fileMappings.ui.tooltip=Une ligne par champ d'envoi : <i>champFichier=propri\u00e9t\u00e9</i>. Les fichiers sont stock\u00e9s dans le dossier des fichiers (noms uniques et nettoy\u00e9s ; la taille d'une image est enregistr\u00e9e) et la propri\u00e9t\u00e9, une r\u00e9f\u00e9rence vers des fichiers, les d\u00e9signe.
fmdbcnt_createContentAction.fileMixin=Mixin des fichiers
fmdbcnt_createContentAction.fileMixin.ui.tooltip=Facultatif. Un mixin ajout\u00e9 \u00e0 chaque fichier stock\u00e9 (par exemple <i>ctmdmix:credited</i>), pour porter les propri\u00e9t\u00e9s de fichier ci-dessous.
fmdbcnt_createContentAction.fileProperties=Propri\u00e9t\u00e9s des fichiers
fmdbcnt_createContentAction.fileProperties.ui.tooltip=Une ligne par champ : <i>champ=propri\u00e9t\u00e9Fichier</i>. La valeur du champ est \u00e9crite sur chaque fichier stock\u00e9 (par exemple <i>credit=ctmdCredit</i>). La propri\u00e9t\u00e9 doit \u00eatre d\u00e9clar\u00e9e par le type de fichier ou par le mixin ci-dessus.
fmdbcnt_createContentAction.fixedValues=Valeurs fixes
fmdbcnt_createContentAction.fixedValues.ui.tooltip=Une ligne par valeur : <i>propri\u00e9t\u00e9=valeur</i> (par exemple <i>submissionStatus=submitted</i>). R\u00e9p\u00e9tez la ligne pour une propri\u00e9t\u00e9 multiple. Une valeur fixe l'emporte sur un champ associ\u00e9 \u00e0 la m\u00eame propri\u00e9t\u00e9.
fmdbcnt_createContentAction.submitterProperty=Propri\u00e9t\u00e9 de l'auteur
fmdbcnt_createContentAction.submitterProperty.ui.tooltip=Facultatif. La propri\u00e9t\u00e9 qui re\u00e7oit le nom d'utilisateur de la personne qui a soumis le formulaire.
fmdbcnt_createContentAction.organizationProperty=Propri\u00e9t\u00e9 de l'organisation
fmdbcnt_createContentAction.organizationProperty.ui.tooltip=Facultatif. La propri\u00e9t\u00e9 qui re\u00e7oit l'organisation (j:organization) de la personne qui a soumis le formulaire.
fmdbcnt_createContentAction.pageProperty=Propri\u00e9t\u00e9 de la page
fmdbcnt_createContentAction.pageProperty.ui.tooltip=Facultatif. La propri\u00e9t\u00e9 de r\u00e9f\u00e9rence qui re\u00e7oit la page depuis laquelle le formulaire a \u00e9t\u00e9 soumis. Elle est retrouv\u00e9e \u00e0 partir de l'adresse indiqu\u00e9e par le navigateur et n'est conserv\u00e9e que s'il s'agit d'une page, ou d'un contenu ayant sa propre page, de ce site que l'utilisateur peut lire ; sinon elle reste vide.
fmdbcnt_createContentAction.requiredPairs=Fichiers compl\u00e9mentaires obligatoires
fmdbcnt_createContentAction.requiredPairs.ui.tooltip=Une ligne par r\u00e8gle : <i>champD\u00e9pendant&lt;-champ:typeMime</i> (par exemple <i>captions&lt;-media:video/*</i>). Quand le champ contient des fichiers dont le type d\u00e9tect\u00e9 correspond, le champ d\u00e9pendant doit en contenir au moins autant, sinon la soumission est refus\u00e9e.
fmdbcnt_createContentAction.pairRefusalMessage=Message en cas de fichier compl\u00e9mentaire manquant
fmdbcnt_createContentAction.pairRefusalMessage.ui.tooltip=Facultatif. La phrase lue par le visiteur quand un fichier compl\u00e9mentaire manque (par exemple : chaque vid\u00e9o a besoin de son fichier de sous-titres). Vide : une phrase g\u00e9n\u00e9rique.
fmdbcnt_createContentAction.publish=Publier
fmdbcnt_createContentAction.publish.ui.tooltip=Publie le contenu cr\u00e9\u00e9 et ses fichiers, dans toutes les langues du site, pour que l'utilisateur les voie aussit\u00f4t. Activ\u00e9 par d\u00e9faut.

# ---- Salesforce (fmdbsfdc) ----
fmdbsfdc_createLeadAction=Cr\u00e9er un Lead Salesforce
fmdbsfdc_createLeadAction.ui.tooltip=Cr\u00e9e un Lead dans Salesforce \u00e0 partir des valeurs soumises. Associez chaque champ du Lead Salesforce \u00e0 un champ du formulaire ou \u00e0 une valeur constante.
fmdbsfdc_createLeadAction.connectionId=Connexion Salesforce
fmdbsfdc_createLeadAction.connectionId.ui.tooltip=Organisation Salesforce vers laquelle le lead est envoy\u00e9. La liste des connexions est g\u00e9r\u00e9e par un administrateur dans la configuration du module.
fmdbsfdc_createLeadAction.fieldMapping=Correspondance des champs du Lead
fmdbsfdc_createLeadAction.fieldMapping.ui.tooltip=Pour chaque champ du Lead Salesforce, choisissez le champ du formulaire dont la valeur est envoy\u00e9e, ou saisissez une valeur constante. Nom et Soci\u00e9t\u00e9 sont obligatoires dans Salesforce.
fmdbsfdc_createLeadAction.duplicateStrategy=Gestion des doublons
fmdbsfdc_createLeadAction.duplicateStrategy.ui.tooltip=Comportement lorsqu'un lead avec la m\u00eame adresse e-mail existe d\u00e9j\u00e0 dans Salesforce.
fmdbsfdc_createLeadAction.duplicateStrategy.create=Toujours cr\u00e9er un nouveau lead
fmdbsfdc_createLeadAction.duplicateStrategy.upsertByEmail=Mettre \u00e0 jour le lead existant ayant la m\u00eame adresse e-mail
fmdbsfdc_createLeadAction.failSubmissionOnError=Faire \u00e9chouer la soumission si Salesforce rejette le lead
fmdbsfdc_createLeadAction.failSubmissionOnError.ui.tooltip=Si activ\u00e9, une erreur Salesforce fait \u00e9chouer la soumission du formulaire et le visiteur voit un message d'erreur. Si d\u00e9sactiv\u00e9, l'erreur est seulement journalis\u00e9e et la soumission r\u00e9ussit.
fmdbsfdc.section.salesforce=Salesforce

# ---- HubSpot (fmdbhs) ----
fmdbhs_createContactAction=Cr\u00e9er un contact HubSpot
fmdbhs_createContactAction.ui.tooltip=Cr\u00e9e un contact dans HubSpot \u00e0 partir des valeurs soumises. Associez chaque propri\u00e9t\u00e9 du contact HubSpot \u00e0 un champ du formulaire ou \u00e0 une valeur constante.
fmdbhs_createContactAction.connectionId=Connexion HubSpot
fmdbhs_createContactAction.connectionId.ui.tooltip=Portail HubSpot vers lequel le contact est envoy\u00e9. La liste des connexions est g\u00e9r\u00e9e par un administrateur dans la configuration du module.
fmdbhs_createContactAction.fieldMapping=Correspondance des propri\u00e9t\u00e9s du contact
fmdbhs_createContactAction.fieldMapping.ui.tooltip=Pour chaque propri\u00e9t\u00e9 du contact HubSpot, choisissez le champ du formulaire dont la valeur est envoy\u00e9e, ou saisissez une valeur constante. Associez l'e-mail pour que HubSpot puisse d\u00e9doublonner le contact.
fmdbhs_createContactAction.duplicateStrategy=Gestion des doublons
fmdbhs_createContactAction.duplicateStrategy.ui.tooltip=Comportement lorsqu'un contact avec la m\u00eame adresse e-mail existe d\u00e9j\u00e0 dans HubSpot.
fmdbhs_createContactAction.duplicateStrategy.create=Toujours cr\u00e9er un nouveau contact
fmdbhs_createContactAction.duplicateStrategy.upsertByEmail=Mettre \u00e0 jour le contact existant ayant la m\u00eame adresse e-mail
fmdbhs_createContactAction.failSubmissionOnError=Faire \u00e9chouer la soumission si HubSpot rejette le contact
fmdbhs_createContactAction.failSubmissionOnError.ui.tooltip=Si activ\u00e9, une erreur HubSpot fait \u00e9chouer la soumission du formulaire et le visiteur voit un message d'erreur. Si d\u00e9sactiv\u00e9, l'erreur est seulement journalis\u00e9e et la soumission r\u00e9ussit.
fmdbhs.section.hubspot=HubSpot

# ---- Efficy (fmdbeff) ----
fmdbeff_createOpportunityAction=Cr\u00e9er une opportunit\u00e9 Efficy
fmdbeff_createOpportunityAction.ui.tooltip=Cr\u00e9e une opportunit\u00e9 dans Efficy e-deal \u00e0 partir des valeurs soumises. Associez chaque champ Efficy \u00e0 un champ du formulaire, une constante, la date de soumission ou la personne Efficy retrouv\u00e9e par l'e-mail saisi.
fmdbeff_createOpportunityAction.connectionId=Connexion Efficy
fmdbeff_createOpportunityAction.connectionId.ui.tooltip=Instance Efficy vers laquelle l'opportunit\u00e9 est envoy\u00e9e. La liste des connexions est g\u00e9r\u00e9e par un administrateur dans la configuration du module.
fmdbeff_createOpportunityAction.fieldMapping=Correspondance des champs de l'opportunit\u00e9
fmdbeff_createOpportunityAction.fieldMapping.ui.tooltip=Pour chaque champ Efficy, choisissez le champ du formulaire dont la valeur est envoy\u00e9e, une constante, la date de soumission ou la recherche de personne par e-mail. Les champs marqu\u00e9s d'un ast\u00e9risque sont obligatoires dans Efficy.
fmdbeff_createOpportunityAction.failSubmissionOnError=Faire \u00e9chouer la soumission si Efficy rejette l'opportunit\u00e9
fmdbeff_createOpportunityAction.failSubmissionOnError.ui.tooltip=Si activ\u00e9, une erreur Efficy fait \u00e9chouer la soumission du formulaire et le visiteur voit un message d'erreur. Si d\u00e9sactiv\u00e9, l'erreur est seulement journalis\u00e9e et la soumission r\u00e9ussit.
fmdbeff.section.efficy=Efficy
