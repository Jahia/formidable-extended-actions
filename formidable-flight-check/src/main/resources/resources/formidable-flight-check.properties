fmdbflt_flightCheckAction=Flight number check
fmdbflt_flightCheckAction.ui.tooltip=Checks that the flight number exists: the airline's own schedule for its flights, AeroDataBox for every other airline. It checks the number only, not the flight date.
fmdbflt_flightCheckAction.autofill=Fill in the airports
fmdbflt_flightCheckAction.autofill.ui.tooltip=Once the visitor has given the flight date and number, the page looks the flight up and writes its departure and arrival airports into the fields picked below. Each new flight or date replaces the airports; the visitor can still change them afterwards.
fmdbflt_flightCheckAction.dateField=Flight date field
fmdbflt_flightCheckAction.dateField.ui.tooltip=The date field of this form that holds the flight's departure date. Without it, nothing is filled.
fmdbflt_flightCheckAction.departureField=Departure airport field
fmdbflt_flightCheckAction.departureField.ui.tooltip=A text field or a list of airports that receives the departure airport. A list needs an option whose value is the airport code (hkg) or whose label ends with it, "Hong Kong (HKG)".
fmdbflt_flightCheckAction.arrivalField=Arrival airport field
fmdbflt_flightCheckAction.arrivalField.ui.tooltip=A text field or a list of airports that receives the arrival airport. An airport missing from the list is left for the visitor to choose.
fmdbflt.autofill.found={airline} {flight}: {from} to {to}.
fmdbflt.autofill.departure=Scheduled departure {time}, local time.
fmdbflt.autofill.notFound=We found no flight {flight} on {date}. Check the number and the date.
fmdbflt.autofill.otherAirport={airport} is not in the list: choose your airport.
fmdbflt.autofill.unavailable=
fmdbflt_flightCheckAction.departureOtherField=Departure airport field, other airports
fmdbflt_flightCheckAction.departureOtherField.ui.tooltip=When the departure field is a list without the flight's airport: the text field that receives it, while the list gets its "another airport" option. Show this field with a rule on that option.
fmdbflt_flightCheckAction.arrivalOtherField=Arrival airport field, other airports
fmdbflt_flightCheckAction.arrivalOtherField.ui.tooltip=When the arrival field is a list without the flight's airport: the text field that receives it, while the list gets its "another airport" option. Show this field with a rule on that option.
fmdbflt_flightCheckAction.otherOptionValue=Value of the "another airport" option
fmdbflt_flightCheckAction.otherOptionValue.ui.tooltip=The value of the option the lists use for an airport they do not hold: other by default (a category named other).
