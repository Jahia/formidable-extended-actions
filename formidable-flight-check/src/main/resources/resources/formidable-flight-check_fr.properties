fmdbflt_flightCheckAction=V\u00e9rification du num\u00e9ro de vol
fmdbflt_flightCheckAction.ui.tooltip=V\u00e9rifie que le num\u00e9ro de vol existe : le programme de la compagnie pour ses propres vols, AeroDataBox pour toutes les autres compagnies. Seul le num\u00e9ro est v\u00e9rifi\u00e9, pas la date du vol.
fmdbflt_flightCheckAction.autofill=Remplir les a\u00e9roports
fmdbflt_flightCheckAction.autofill.ui.tooltip=Une fois la date et le num\u00e9ro du vol saisis, la page recherche le vol et \u00e9crit ses a\u00e9roports de d\u00e9part et d'arriv\u00e9e dans les champs choisis ci-dessous. Chaque nouveau vol ou nouvelle date remplace les a\u00e9roports ; le visiteur peut encore les modifier ensuite.
fmdbflt_flightCheckAction.dateField=Champ de la date du vol
fmdbflt_flightCheckAction.dateField.ui.tooltip=Le champ date de ce formulaire qui contient la date de d\u00e9part du vol. Sans lui, rien n'est rempli.
fmdbflt_flightCheckAction.departureField=Champ de l'a\u00e9roport de d\u00e9part
fmdbflt_flightCheckAction.departureField.ui.tooltip=Un champ texte ou une liste d'a\u00e9roports qui re\u00e7oit l'a\u00e9roport de d\u00e9part. Une liste a besoin d'une option dont la valeur est le code de l'a\u00e9roport (hkg) ou dont le libell\u00e9 finit par lui, \u00ab Hong Kong (HKG) \u00bb.
fmdbflt_flightCheckAction.arrivalField=Champ de l'a\u00e9roport d'arriv\u00e9e
fmdbflt_flightCheckAction.arrivalField.ui.tooltip=Un champ texte ou une liste d'a\u00e9roports qui re\u00e7oit l'a\u00e9roport d'arriv\u00e9e. Un a\u00e9roport absent de la liste est laiss\u00e9 au choix du visiteur.
fmdbflt.autofill.found={airline} {flight} : {from} vers {to}.
fmdbflt.autofill.departure=D\u00e9part pr\u00e9vu le {time}, heure locale.
fmdbflt.autofill.notFound=Nous ne trouvons aucun vol {flight} le {date}. V\u00e9rifiez le num\u00e9ro et la date.
fmdbflt.autofill.otherAirport={airport} n'est pas dans la liste : choisissez votre a\u00e9roport.
fmdbflt.autofill.unavailable=
fmdbflt_flightCheckAction.departureOtherField=Champ de l'a\u00e9roport de d\u00e9part, autres a\u00e9roports
fmdbflt_flightCheckAction.departureOtherField.ui.tooltip=Quand le champ de d\u00e9part est une liste sans l'a\u00e9roport du vol : le champ texte qui le re\u00e7oit, la liste prenant son option \u00ab un autre a\u00e9roport \u00bb. Affichez ce champ avec une r\u00e8gle sur cette option.
fmdbflt_flightCheckAction.arrivalOtherField=Champ de l'a\u00e9roport d'arriv\u00e9e, autres a\u00e9roports
fmdbflt_flightCheckAction.arrivalOtherField.ui.tooltip=Quand le champ d'arriv\u00e9e est une liste sans l'a\u00e9roport du vol : le champ texte qui le re\u00e7oit, la liste prenant son option \u00ab un autre a\u00e9roport \u00bb. Affichez ce champ avec une r\u00e8gle sur cette option.
fmdbflt_flightCheckAction.otherOptionValue=Valeur de l'option \u00ab un autre a\u00e9roport \u00bb
fmdbflt_flightCheckAction.otherOptionValue.ui.tooltip=La valeur de l'option que les listes utilisent pour un a\u00e9roport qu'elles ne contiennent pas : other par d\u00e9faut (une cat\u00e9gorie nomm\u00e9e other).
