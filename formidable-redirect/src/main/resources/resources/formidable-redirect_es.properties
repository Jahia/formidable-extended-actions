# Formidable Redirect: editor labels and tooltips of the Redirect action.
fmdbred_redirectAction=Redirecci\u00f3n
fmdbred_redirectAction.ui.tooltip=Env\u00eda al visitante a otra p\u00e1gina del sitio una vez aceptado el env\u00edo. El mensaje de env\u00edo se muestra mientras el navegador cambia de p\u00e1gina.
fmdbred_redirectAction.targetType=Destino
fmdbred_redirectAction.targetType.ui.tooltip=Una p\u00e1gina del sitio elegida en el selector de p\u00e1ginas, o una ruta del sitio que usted escribe. Nunca otro sitio web.
fmdbred_redirectAction.targetType.page=Una p\u00e1gina del sitio
fmdbred_redirectAction.targetType.path=Una ruta del sitio
fmdbred_redirectAction.page=P\u00e1gina
fmdbred_redirectAction.page.ui.tooltip=La p\u00e1gina a la que se env\u00eda al visitante. Sigue a la p\u00e1gina si se mueve o se renombra, y debe estar publicada.
fmdbred_redirectAction.path=Ruta
fmdbred_redirectAction.path.ui.tooltip=Una ruta de este sitio, que empieza con una sola barra. <b>Ejemplo:</b> <i>/sites/misitio/gracias.html</i>. Se rechaza otro sitio web.
