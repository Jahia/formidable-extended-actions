# default configuration - won't be overriden
# Deployed once, then kept as edited.
# Formidable PDF (PID org.jahia.modules.formidable.pdf): the PDF copies of the "PDF copy" form action. Jahia copies this
# file to digital-factory-data/karaf/etc the first time the module starts without it there, and the first line tells
# Jahia never to overwrite that copy: edit it, your changes are kept. Every value below is the built-in default.
#
# A copy is kept in memory, per JVM, never in the repository: a restart drops the copies, and on a cluster the download
# must reach the node that took the submission (a sticky session).
#
# Minutes a visitor can download their copy for, counted from the submission. 1 to 1440.
downloadMinutes=30
# Copies kept at once. Past it, the oldest is dropped. 1 to 10000.
maxReceipts=500
