# Formidable Redirect: editor labels and tooltips of the Redirect action.
fmdbred_redirectAction=Redirect
fmdbred_redirectAction.ui.tooltip=Sends the visitor to another page of the site once the submission is accepted. The submission message is shown while the browser navigates.
fmdbred_redirectAction.targetType=Destination
fmdbred_redirectAction.targetType.ui.tooltip=A page of the site picked in the page picker, or a path of the site you type. Never another website.
fmdbred_redirectAction.targetType.page=A page of the site
fmdbred_redirectAction.targetType.path=A path of the site
fmdbred_redirectAction.page=Page
fmdbred_redirectAction.page.ui.tooltip=The page the visitor is sent to. It follows the page when it is moved or renamed, and it must be published.
fmdbred_redirectAction.path=Path
fmdbred_redirectAction.path.ui.tooltip=A path of this site, starting with a single slash. <b>Example:</b> <i>/sites/mysite/thank-you.html</i>. Another website is refused.
